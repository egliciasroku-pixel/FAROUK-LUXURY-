
<!DOCTYPE html>
<html lang="fr" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORE</title>

    <!-- Google Fonts: Plus Jakarta Sans & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fr: ['Plus Jakarta Sans', 'sans-serif'],
                        ar: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        ink: {
                            950: '#0F172A',
                            900: '#1E293B',
                            800: '#334155',
                            600: '#475569',
                        },
                        emerald: {
                            wa: '#059669',
                        },
                        rose: {
                            alert: '#E11D48',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Luminous radiant white glassmorphism over subtle grey #e8eaed */
        :root {
            --surface-glass: linear-gradient(145deg, rgba(255, 255, 255, 0.90) 0%, rgba(255, 255, 255, 0.74) 100%);
            --surface-glass-hover: linear-gradient(145deg, rgba(255, 255, 255, 0.97) 0%, rgba(255, 255, 255, 0.86) 100%);
            --border-luminous: rgba(255, 255, 255, 0.95);
            --shadow-luminous:
                0 10px 28px -12px rgba(15, 23, 42, 0.12),
                0 0 22px rgba(255, 255, 255, 0.85),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.98);
        }

        body {
            background-color: #e8eaed;
            background-image:
                radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.85) 0%, transparent 45%),
                radial-gradient(circle at 85% 18%, rgba(255, 255, 255, 0.72) 0%, transparent 48%),
                radial-gradient(circle at 50% 88%, rgba(255, 255, 255, 0.65) 0%, transparent 55%),
                linear-gradient(180deg, #eceef1 0%, #e8eaed 55%, #e3e6ea 100%);
            background-attachment: fixed;
            color: #0F172A;
            overflow-x: hidden;
        }

        body[data-lang="fr"] {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body[data-lang="ar"] {
            font-family: 'Cairo', sans-serif;
        }

        .glass-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(22px) saturate(155%);
            -webkit-backdrop-filter: blur(22px) saturate(155%);
            border: 1px solid var(--border-luminous);
            box-shadow: var(--shadow-luminous);
        }

        .glass-card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(155%);
            -webkit-backdrop-filter: blur(20px) saturate(155%);
            border: 1px solid var(--border-luminous);
            box-shadow: var(--shadow-luminous);
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            background: var(--surface-glass-hover);
            box-shadow:
                0 16px 34px -12px rgba(15, 23, 42, 0.16),
                0 0 30px rgba(255, 255, 255, 1),
                inset 0 1px 0 0 rgba(255, 255, 255, 1);
        }

        .glass-btn {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            color: #0F172A;
            border: 1px solid rgba(255, 255, 255, 0.96);
            box-shadow:
                0 4px 14px rgba(15, 23, 42, 0.08),
                0 0 18px rgba(255, 255, 255, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            transition: all 0.2s ease;
        }

        .glass-btn:hover:not(:disabled) {
            background: #FFFFFF;
            transform: translateY(-1px);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.45);
            color: #0F172A;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .glass-input:focus {
            background: #FFFFFF;
            border-color: #0F172A;
            outline: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body data-lang="fr" class="min-h-screen antialiased selection:bg-ink-950 selection:text-white">

    <!-- Ambient Radiant White Glow -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-24 end-1/4 w-[460px] h-[460px] rounded-full bg-white/75 blur-[120px]"></div>
        <div class="absolute top-1/2 -start-24 w-[420px] h-[420px] rounded-full bg-white/60 blur-[115px]"></div>
        <div class="absolute -bottom-24 end-1/3 w-[460px] h-[460px] rounded-full bg-white/65 blur-[125px]"></div>
    </div>

    <!-- Top Header: Shows STORE (and optional - Name) + Language Switcher -->
    <header id="site-header" class="sticky top-0 z-30 glass-panel border-b border-white/95">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
            <!-- Brand Title -->
            <a
                href="#"
                id="brand-link"
                onclick="handleBrandClick(event)"
                class="flex items-center gap-2.5 min-w-0 group"
            >
                <span class="w-10 h-10 rounded-2xl bg-ink-950 text-white flex items-center justify-center shrink-0 shadow-xs">
                    <i class="fa-solid fa-gem text-base"></i>
                </span>
                <span id="brand-title" class="text-lg sm:text-2xl font-black tracking-tight text-ink-950 truncate">STORE</span>
            </a>

            <!-- Right Controls: Language Switcher (and optional Cart in normal storefront mode) -->
            <div class="flex items-center gap-2 shrink-0">
                <button
                    type="button"
                    id="storefront-cart-btn"
                    onclick="toggleCartDrawer(true)"
                    class="hidden items-center gap-2 px-3.5 py-2 rounded-xl glass-btn text-xs sm:text-sm font-extrabold cursor-pointer"
                >
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-count-badge" class="px-1.5 py-0.5 rounded-full bg-ink-950 text-white text-[11px]">0</span>
                </button>

                <button
                    type="button"
                    id="lang-toggle-btn"
                    onclick="toggleLanguage()"
                    class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-ink-950 hover:bg-ink-900 text-white text-xs sm:text-sm font-extrabold shadow-xs transition-all cursor-pointer"
                >
                    <i class="fa-solid fa-globe text-xs"></i>
                    <span id="lang-toggle-label">العربية</span>
                </button>
            </div>
        </div>

        <!-- Category Tabs (Shown only in normal storefront mode) -->
        <nav id="storefront-category-nav" class="hidden border-t border-white/80 bg-white/55">
            <div class="max-w-7xl mx-auto px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
                <button type="button" onclick="selectCategory('all')" data-cat="all" class="sf-cat-btn shrink-0 px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-ink-950 text-white cursor-pointer">
                    <span class="lbl-cat-all"></span>
                </button>
                <button type="button" onclick="selectCategory('electronics')" data-cat="electronics" class="sf-cat-btn shrink-0 px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-ink-900 hover:bg-white/85 cursor-pointer">
                    <span class="lbl-cat-electronics"></span>
                </button>
                <button type="button" onclick="selectCategory('appliances')" data-cat="appliances" class="sf-cat-btn shrink-0 px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-ink-900 hover:bg-white/85 cursor-pointer">
                    <span class="lbl-cat-appliances"></span>
                </button>
                <button type="button" onclick="selectCategory('cosmetics')" data-cat="cosmetics" class="sf-cat-btn shrink-0 px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-ink-900 hover:bg-white/85 cursor-pointer">
                    <span class="lbl-cat-cosmetics"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 pt-6 pb-24 space-y-6">

        <!-- Optional Payload Setting Banner (when decoded from payload JSON) -->
        <div id="payload-setting-banner" class="hidden glass-panel rounded-2xl px-4 py-3 text-xs sm:text-sm font-bold text-ink-950">
            <span id="payload-setting-text"></span>
        </div>

        <!-- Active Category Section -->
        <section id="category-section" class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/85 pb-4">
                <div class="flex items-center gap-3">
                    <h1 id="active-category-heading" class="text-xl sm:text-3xl font-black text-ink-950"></h1>
                    <span id="active-category-count" class="px-3 py-0.5 rounded-full bg-white/90 border border-white text-ink-950 text-xs font-extrabold shadow-2xs">0</span>
                </div>

                <!-- Normal Storefront Search (Hidden in role link mode) -->
                <div id="storefront-search-box" class="hidden w-full sm:w-72 relative">
                    <i class="fa-solid fa-magnifying-glass start-3.5 top-1/2 -translate-y-1/2 absolute text-ink-600 text-xs"></i>
                    <input
                        type="text"
                        id="storefront-search-input"
                        oninput="handleStorefrontSearch(this.value)"
                        class="glass-input w-full rounded-xl py-2 ps-9 pe-3 text-xs sm:text-sm"
                    >
                </div>
            </div>

            <!-- Products Grid -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden glass-panel rounded-3xl p-10 text-center space-y-2">
                <i class="fa-solid fa-box-open text-3xl text-ink-600"></i>
                <p id="empty-state-text" class="text-sm font-bold text-ink-800"></p>
            </div>
        </section>
    </main>

    <!-- Floating Bottom WhatsApp Button (Wired directly to https://wa.me/<digits-only-phone> when phone is provided) -->
    <a
        id="floating-whatsapp-btn"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp"
        class="hidden fixed bottom-5 end-5 z-40 w-14 h-14 rounded-full bg-emerald-wa text-white items-center justify-center text-2xl shadow-[0_10px_26px_rgba(5,150,105,0.38)] hover:scale-110 transition-transform"
    >
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Normal Storefront Cart Drawer (Hidden in role link mode) -->
    <div id="cart-overlay" onclick="toggleCartDrawer(false)" class="fixed inset-0 z-50 hidden bg-ink-950/35 backdrop-blur-xs"></div>
    <aside id="cart-drawer" class="fixed top-0 end-0 z-50 h-full w-full max-w-md bg-white/92 backdrop-blur-2xl border-s border-white shadow-2xl transform translate-x-full rtl:-translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
            <h2 id="cart-drawer-heading" class="text-base font-black text-ink-950"></h2>
            <button type="button" onclick="toggleCartDrawer(false)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-rose-alert hover:text-white text-ink-950 flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-4 border-t border-slate-200 bg-white/85 space-y-3">
            <div class="flex items-center justify-between text-sm font-black text-ink-950">
                <span id="cart-total-label"></span>
                <span id="cart-total-value">0</span>
            </div>
            <button type="button" id="cart-wa-checkout-btn" onclick="openStorefrontCartWhatsApp()" class="w-full py-3 rounded-xl bg-emerald-wa text-white text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 cursor-pointer disabled:opacity-40">
                <i class="fa-brands fa-whatsapp text-base"></i>
                <span id="cart-wa-checkout-label"></span>
            </button>
        </div>
    </aside>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 start-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // =====================================================================
        // TRANSLATIONS (Formal French Default + Instant Arabic/French Switch)
        // =====================================================================
        const I18N = {
            fr: {
                toggleLabel: "العربية",
                catAll: "Tous",
                catElectronics: "Électronique",
                catAppliances: "Électroménager",
                catCosmetics: "Cosmétiques",
                orderBtn: "Commander",
                emptyText: "Aucun produit disponible dans cette catégorie.",
                searchPlaceholder: "Rechercher...",
                cartHeading: "Panier",
                cartTotalLabel: "Total",
                cartWaOrder: "Commander via WhatsApp",
                addedToast: "Ajouté au panier.",
                waIntroRole: (name, catLabel) => name
                    ? `Bonjour STORE (${name}) — ${catLabel}`
                    : `Bonjour STORE — ${catLabel}`,
                waProductLine: (productName, priceStr) => priceStr
                    ? `Produit : ${productName} | Prix : ${priceStr}`
                    : `Produit : ${productName}`,
                waCartHeader: (name, catLabel) => name
                    ? `Bonjour STORE (${name}) — ${catLabel} :`
                    : `Bonjour STORE — ${catLabel} :`,
                waCartItem: (productName, qty, linePriceStr) => linePriceStr
                    ? `- ${productName} (x${qty}) : ${linePriceStr}`
                    : `- ${productName} (x${qty})`,
                waCartTotal: (totalStr) => `Total : ${totalStr}`
            },
            ar: {
                toggleLabel: "Français",
                catAll: "الكل",
                catElectronics: "الأجهزة الإلكترونية",
                catAppliances: "الأجهزة المنزلية",
                catCosmetics: "مواد التجميل",
                orderBtn: "طلب",
                emptyText: "لا توجد منتجات في هذا القسم حالياً.",
                searchPlaceholder: "بحث...",
                cartHeading: "السلة",
                cartTotalLabel: "المجموع",
                cartWaOrder: "الطلب عبر واتساب",
                addedToast: "تمت الإضافة إلى السلة.",
                waIntroRole: (name, catLabel) => name
                    ? `مرحباً STORE (${name}) — ${catLabel}`
                    : `مرحباً STORE — ${catLabel}`,
                waProductLine: (productName, priceStr) => priceStr
                    ? `المنتج: ${productName} | السعر: ${priceStr}`
                    : `المنتج: ${productName}`,
                waCartHeader: (name, catLabel) => name
                    ? `مرحباً STORE (${name}) — ${catLabel}:`
                    : `مرحباً STORE — ${catLabel}:`,
                waCartItem: (productName, qty, linePriceStr) => linePriceStr
                    ? `- ${productName} (x${qty}): ${linePriceStr}`
                    : `- ${productName} (x${qty})`,
                waCartTotal: (totalStr) => `المجموع: ${totalStr}`
            }
        };

        // =====================================================================
        // INLINE SVG FALLBACK IMAGE (No external image URLs or placeholders)
        // =====================================================================
        function makeSvgFallback(label) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
                <rect width="600" height="600" fill="#F8FAFC"/>
                <circle cx="300" cy="255" r="105" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
                <polygon points="300,185 360,255 300,325 240,255" fill="none" stroke="#0F172A" stroke-width="4"/>
                <text x="300" y="420" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="26" font-weight="800" letter-spacing="3">STORE</text>
                <text x="300" y="455" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="16" letter-spacing="1">${escapeXml(label)}</text>
            </svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        function escapeXml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // =====================================================================
        // APPLICATION STATE (Zero hardcoded numbers, sample products, or PINs)
        // =====================================================================
        const STORAGE_KEY_PRODUCTS = "store_role_catalog_v1";
        const STORAGE_KEY_CART = "store_role_cart_v1";

        const state = {
            lang: "fr",
            isRoleLinkMode: false,
            role: "",
            name: "",
            phoneDigits: "",
            category: "all",
            searchQuery: "",
            payloadSetting: "",
            products: [],
            cart: []
        };

        function t() {
            return I18N[state.lang] || I18N.fr;
        }

        function getCategoryLabel(cat, lang = state.lang) {
            const dict = I18N[lang] || I18N.fr;
            if (cat === "electronics") return dict.catElectronics;
            if (cat === "appliances") return dict.catAppliances;
            if (cat === "cosmetics") return dict.catCosmetics;
            return dict.catAll;
        }

        function formatPrice(price) {
            if (price === undefined || price === null || price === "") return "";
            const num = Number(price);
            if (!Number.isNaN(num) && Number.isFinite(num)) {
                return num.toLocaleString();
            }
            return String(price);
        }

        // UTF-8 safe Base64 decoder
        function decodeBase64Utf8(b64) {
            const clean = String(b64 || "").replace(/\s+/g, "");
            return decodeURIComponent(escape(atob(clean)));
        }

        // =====================================================================
        // INITIALIZATION & URL QUERY PARSING
        // =====================================================================
        document.addEventListener("DOMContentLoaded", () => {
            loadStoredData();
            parseUrlQueryParams();
            applyLanguage(state.lang);
        });

        function loadStoredData() {
            try {
                const rawProds = localStorage.getItem(STORAGE_KEY_PRODUCTS);
                if (rawProds) {
                    const parsed = JSON.parse(rawProds);
                    if (Array.isArray(parsed)) state.products = parsed;
                }
            } catch (_) {
                state.products = [];
            }

            try {
                const rawCart = localStorage.getItem(STORAGE_KEY_CART);
                if (rawCart) {
                    const parsedCart = JSON.parse(rawCart);
                    if (Array.isArray(parsedCart)) state.cart = parsedCart;
                }
            } catch (_) {
                state.cart = [];
            }
        }

        function saveStoredData() {
            try {
                localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(state.products));
                localStorage.setItem(STORAGE_KEY_CART, JSON.stringify(state.cart));
            } catch (_) {}
        }

        function parseUrlQueryParams() {
            const params = new URLSearchParams(window.location.search);

            const langParam = (params.get("lang") || "").trim().toLowerCase();
            if (langParam === "ar" || langParam === "fr") {
                state.lang = langParam;
            }

            const roleParam = (params.get("role") || "").trim().toLowerCase();
            if (roleParam === "client" || roleParam === "seller") {
                state.isRoleLinkMode = true;
                state.role = roleParam;
            }

            const nameParam = (params.get("name") || "").trim();
            if (nameParam) {
                state.name = nameParam;
            }

            const phoneParam = (params.get("phone") || "").trim();
            if (phoneParam) {
                state.phoneDigits = phoneParam.replace(/\D/g, "");
            }

            const catParam = (params.get("cat") || "").trim().toLowerCase();
            if (["all", "electronics", "appliances", "cosmetics"].includes(catParam)) {
                state.category = catParam;
            } else if (state.isRoleLinkMode) {
                state.category = "all";
            }

            const payloadParam = params.get("payload");
            if (payloadParam) {
                decodeAndMergePayload(payloadParam);
            }
        }

        function decodeAndMergePayload(b64Str) {
            try {
                const decodedText = decodeBase64Utf8(b64Str);
                const parsed = JSON.parse(decodedText);

                const mergeProduct = (item, index) => {
                    if (!item || typeof item !== "object") return;
                    const itemCat = ["electronics", "appliances", "cosmetics"].includes(String(item.category || "").toLowerCase())
                        ? String(item.category).toLowerCase()
                        : (state.category !== "all" ? state.category : "electronics");

                    // Only merge payload products matching the selected category when a specific category is selected
                    if (state.category !== "all" && itemCat !== state.category) {
                        return;
                    }

                    const prodId = item.id || `payload-${itemCat}-${index}-${String(item.name || item.nameFr || item.nameAr || "").slice(0, 12)}`;
                    const productObj = {
                        id: prodId,
                        category: itemCat,
                        name: item.name || item.nameFr || item.nameAr || "",
                        price: item.price !== undefined && item.price !== "" ? item.price : "",
                        image: item.image || ""
                    };

                    const existingIdx = state.products.findIndex((p) => String(p.id) === String(prodId));
                    if (existingIdx >= 0) {
                        state.products[existingIdx] = { ...state.products[existingIdx], ...productObj };
                    } else {
                        state.products.push(productObj);
                    }
                };

                if (Array.isArray(parsed)) {
                    parsed.forEach(mergeProduct);
                } else if (parsed && typeof parsed === "object") {
                    if (typeof parsed.setting === "string" && parsed.setting.trim()) {
                        state.payloadSetting = parsed.setting.trim();
                    }
                    if (Array.isArray(parsed.products)) {
                        parsed.products.forEach(mergeProduct);
                    }
                }

                saveStoredData();
            } catch (_) {
                // Ignore malformed Base64 or JSON safely
            }
        }

        // =====================================================================
        // LANGUAGE TOGGLE & UI RENDERING
        // =====================================================================
        function toggleLanguage() {
            applyLanguage(state.lang === "fr" ? "ar" : "fr");
        }

        function applyLanguage(lang) {
            state.lang = lang === "ar" ? "ar" : "fr";
            const dict = t();

            document.documentElement.lang = state.lang;
            document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
            document.body.dataset.lang = state.lang;

            const headerBrandText = state.name ? `STORE - ${state.name}` : "STORE";
            document.title = headerBrandText;
            const brandTitleEl = document.getElementById("brand-title");
            if (brandTitleEl) brandTitleEl.textContent = headerBrandText;

            const langLabelEl = document.getElementById("lang-toggle-label");
            if (langLabelEl) langLabelEl.textContent = dict.toggleLabel;

            document.querySelectorAll(".lbl-cat-all").forEach((el) => (el.textContent = dict.catAll));
            document.querySelectorAll(".lbl-cat-electronics").forEach((el) => (el.textContent = dict.catElectronics));
            document.querySelectorAll(".lbl-cat-appliances").forEach((el) => (el.textContent = dict.catAppliances));
            document.querySelectorAll(".lbl-cat-cosmetics").forEach((el) => (el.textContent = dict.catCosmetics));

            const searchInput = document.getElementById("storefront-search-input");
            if (searchInput) searchInput.placeholder = dict.searchPlaceholder;

            const emptyTextEl = document.getElementById("empty-state-text");
            if (emptyTextEl) emptyTextEl.textContent = dict.emptyText;

            const cartHeadingEl = document.getElementById("cart-drawer-heading");
            if (cartHeadingEl) cartHeadingEl.textContent = dict.cartHeading;

            const cartTotalLabelEl = document.getElementById("cart-total-label");
            if (cartTotalLabelEl) cartTotalLabelEl.textContent = dict.cartTotalLabel;

            const cartWaOrderEl = document.getElementById("cart-wa-checkout-label");
            if (cartWaOrderEl) cartWaOrderEl.textContent = dict.cartWaOrder;

            const bannerEl = document.getElementById("payload-setting-banner");
            const bannerTextEl = document.getElementById("payload-setting-text");
            if (bannerEl && bannerTextEl) {
                if (state.payloadSetting) {
                    bannerTextEl.textContent = state.payloadSetting;
                    bannerEl.classList.remove("hidden");
                } else {
                    bannerEl.classList.add("hidden");
                }
            }

            configureModeVisibility();
            updateFloatingWhatsAppLink();
            renderCategorySection();
            updateCartUI();
        }

        function configureModeVisibility() {
            const catNav = document.getElementById("storefront-category-nav");
            const searchBox = document.getElementById("storefront-search-box");
            const cartBtn = document.getElementById("storefront-cart-btn");

            if (state.isRoleLinkMode) {
                // Hide extra navigation, search, and cart controls in client/seller link mode
                if (catNav) catNav.classList.add("hidden");
                if (searchBox) searchBox.classList.add("hidden");
                if (cartBtn) cartBtn.classList.add("hidden");
            } else {
                // Normal storefront mode
                if (catNav) catNav.classList.remove("hidden");
                if (searchBox) searchBox.classList.remove("hidden");
                if (cartBtn) cartBtn.classList.remove("hidden");
            }
        }

        function handleBrandClick(e) {
            e.preventDefault();
            if (!state.isRoleLinkMode) {
                selectCategory("all");
            }
        }

        function selectCategory(cat) {
            if (state.isRoleLinkMode) return;
            state.category = cat;
            document.querySelectorAll(".sf-cat-btn").forEach((btn) => {
                const active = btn.dataset.cat === cat;
                btn.className = `sf-cat-btn shrink-0 px-4 py-1.5 rounded-xl text-xs sm:text-sm cursor-pointer ${
                    active
                        ? "font-bold bg-ink-950 text-white"
                        : "font-semibold text-ink-900 hover:bg-white/85"
                }`;
            });
            renderCategorySection();
        }

        function handleStorefrontSearch(val) {
            state.searchQuery = val || "";
            renderCategorySection();
        }

        function renderCategorySection() {
            const dict = t();
            const headingEl = document.getElementById("active-category-heading");
            const countEl = document.getElementById("active-category-count");
            const gridEl = document.getElementById("products-grid");
            const emptyEl = document.getElementById("empty-state");

            if (headingEl) {
                headingEl.textContent = getCategoryLabel(state.category);
            }

            const q = state.searchQuery.trim().toLowerCase();
            const filtered = state.products.filter((prod) => {
                const matchesCat = state.category === "all" || prod.category === state.category;
                if (!matchesCat) return false;
                if (!q || state.isRoleLinkMode) return true;
                return String(prod.name || "").toLowerCase().includes(q);
            });

            if (countEl) countEl.textContent = `${filtered.length}`;

            if (!filtered.length) {
                if (gridEl) gridEl.innerHTML = "";
                if (emptyEl) emptyEl.classList.remove("hidden");
                return;
            }

            if (emptyEl) emptyEl.classList.add("hidden");
            if (!gridEl) return;

            gridEl.innerHTML = filtered.map((prod) => {
                const prodName = String(prod.name || "");
                const priceFormatted = formatPrice(prod.price);
                const catLabel = getCategoryLabel(prod.category);
                const fallbackSvg = makeSvgFallback(catLabel);
                const imgSrc = prod.image && String(prod.image).trim() ? prod.image : fallbackSvg;

                const actionButtonHtml = state.isRoleLinkMode
                    ? `
                        <button
                            type="button"
                            onclick="orderProductViaWhatsApp('${escapeJsSingle(String(prod.id))}')"
                            class="w-full py-2.5 px-4 rounded-xl bg-emerald-wa hover:brightness-110 text-white text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 transition-all cursor-pointer"
                        >
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>${escapeHtml(dict.orderBtn)}</span>
                        </button>
                    `
                    : `
                        <div class="flex items-center gap-2">
                            <button
                                type="button"
                                onclick="addToStorefrontCart('${escapeJsSingle(String(prod.id))}')"
                                class="flex-1 py-2.5 px-3 rounded-xl glass-btn text-xs sm:text-sm font-extrabold flex items-center justify-center gap-1.5 cursor-pointer"
                            >
                                <i class="fa-solid fa-bag-shopping"></i>
                                <span>${escapeHtml(dict.orderBtn)}</span>
                            </button>
                            <button
                                type="button"
                                onclick="orderProductViaWhatsApp('${escapeJsSingle(String(prod.id))}')"
                                aria-label="WhatsApp"
                                class="py-2.5 px-3 rounded-xl bg-emerald-wa text-white text-xs sm:text-sm font-bold cursor-pointer"
                            >
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>
                        </div>
                    `;

                return `
                    <article class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between">
                        <div class="aspect-square bg-white/60 overflow-hidden border-b border-white/80">
                            <img
                                src="${escapeHtml(imgSrc)}"
                                onerror="this.onerror=null;this.src='${fallbackSvg}'"
                                alt="${escapeHtml(prodName)}"
                                class="w-full h-full object-cover"
                            >
                        </div>
                        <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between space-y-4">
                            <div class="space-y-1.5">
                                <span class="inline-block px-2.5 py-0.5 rounded-lg bg-white/90 border border-white text-ink-800 text-[11px] font-bold">
                                    ${escapeHtml(catLabel)}
                                </span>
                                <h2 class="text-sm sm:text-base font-extrabold text-ink-950 leading-snug">
                                    ${escapeHtml(prodName)}
                                </h2>
                                ${priceFormatted ? `<p class="text-base sm:text-lg font-black text-ink-950">${escapeHtml(priceFormatted)}</p>` : ""}
                            </div>
                            ${actionButtonHtml}
                        </div>
                    </article>
                `;
            }).join("");
        }

        // =====================================================================
        // WHATSAPP ORDERING & FLOATING BUTTON
        // =====================================================================
        function buildWhatsAppUrl(messageText) {
            const encoded = encodeURIComponent(messageText || "");
            if (state.phoneDigits) {
                return `https://wa.me/${state.phoneDigits}?text=${encoded}`;
            }
            return `https://wa.me/?text=${encoded}`;
        }

        function updateFloatingWhatsAppLink() {
            const btn = document.getElementById("floating-whatsapp-btn");
            if (!btn) return;

            if (state.isRoleLinkMode && state.phoneDigits) {
                const catLabel = getCategoryLabel(state.category);
                const defaultMsg = t().waIntroRole(state.name, catLabel);
                btn.href = buildWhatsAppUrl(defaultMsg);
                btn.classList.remove("hidden");
                btn.classList.add("flex");
            } else {
                btn.href = "#";
                btn.classList.add("hidden");
                btn.classList.remove("flex");
            }
        }

        function orderProductViaWhatsApp(productId) {
            const prod = state.products.find((p) => String(p.id) === String(productId));
            if (!prod) return;

            const dict = t();
            const catLabel = getCategoryLabel(prod.category || state.category);
            const priceStr = formatPrice(prod.price);
            const message = [
                dict.waIntroRole(state.name, catLabel),
                dict.waProductLine(prod.name || "", priceStr)
            ].join("\n");

            const url = buildWhatsAppUrl(message);
            window.open(url, "_blank", "noopener,noreferrer");
        }

        // =====================================================================
        // NORMAL STOREFRONT CART HELPERS
        // =====================================================================
        function addToStorefrontCart(productId) {
            const prod = state.products.find((p) => String(p.id) === String(productId));
            if (!prod) return;
            const existing = state.cart.find((c) => String(c.id) === String(productId));
            if (existing) existing.qty += 1;
            else state.cart.push({ id: prod.id, qty: 1 });
            saveStoredData();
            updateCartUI();
            showToast(t().addedToast);
        }

        function updateCartUI() {
            const dict = t();
            const totalQty = state.cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
            const badgeEl = document.getElementById("cart-count-badge");
            if (badgeEl) badgeEl.textContent = `${totalQty}`;

            const box = document.getElementById("cart-items-container");
            const totalValEl = document.getElementById("cart-total-value");
            const checkoutBtn = document.getElementById("cart-wa-checkout-btn");

            let sumPrice = 0;
            if (box) {
                box.innerHTML = state.cart.map((item) => {
                    const prod = state.products.find((p) => String(p.id) === String(item.id));
                    if (!prod) return "";
                    const unitPrice = Number(prod.price) || 0;
                    const lineTotal = unitPrice * (Number(item.qty) || 1);
                    sumPrice += lineTotal;
                    return `
                        <div class="p-3 rounded-2xl bg-white/85 border border-white flex items-center justify-between gap-2 text-xs sm:text-sm">
                            <div class="min-w-0">
                                <p class="font-bold text-ink-950 truncate">${escapeHtml(prod.name || "")}</p>
                                <p class="text-xs font-extrabold text-ink-800">x${item.qty}${lineTotal ? ` — ${escapeHtml(formatPrice(lineTotal))}` : ""}</p>
                            </div>
                        </div>
                    `;
                }).join("");
            }

            if (totalValEl) totalValEl.textContent = formatPrice(sumPrice);
            if (checkoutBtn) checkoutBtn.disabled = state.cart.length === 0;
        }

        function toggleCartDrawer(open) {
            const drawer = document.getElementById("cart-drawer");
            const overlay = document.getElementById("cart-overlay");
            if (!drawer || !overlay) return;
            if (open) {
                overlay.classList.remove("hidden");
                drawer.classList.remove("translate-x-full", "rtl:-translate-x-full");
            } else {
                overlay.classList.add("hidden");
                drawer.classList.add("translate-x-full", "rtl:-translate-x-full");
            }
        }

        function openStorefrontCartWhatsApp() {
            if (!state.cart.length) return;
            const dict = t();
            const catLabel = getCategoryLabel(state.category);
            const lines = [dict.waCartHeader(state.name, catLabel)];
            let sumPrice = 0;

            state.cart.forEach((item) => {
                const prod = state.products.find((p) => String(p.id) === String(item.id));
                if (!prod) return;
                const qty = Number(item.qty) || 1;
                const unitPrice = Number(prod.price) || 0;
                const lineTotal = unitPrice * qty;
                sumPrice += lineTotal;
                lines.push(dict.waCartItem(prod.name || "", qty, lineTotal ? formatPrice(lineTotal) : ""));
            });

            if (sumPrice > 0) {
                lines.push(dict.waCartTotal(formatPrice(sumPrice)));
            }

            window.open(buildWhatsAppUrl(lines.join("\n")), "_blank", "noopener,noreferrer");
        }

        // =====================================================================
        // UTILITIES
        // =====================================================================
        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeJsSingle(str) {
            return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }

        function showToast(msg) {
            const box = document.getElementById("toast-container");
            if (!box) return;
            const el = document.createElement("div");
            el.className = "glass-panel text-ink-950 px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold shadow-lg";
            el.textContent = msg;
            box.appendChild(el);
            setTimeout(() => {
                el.style.opacity = "0";
                el.style.transition = "opacity 0.25s ease";
                setTimeout(() => el.remove(), 260);
            }, 2200);
        }
    </script>
</body>
</html>
