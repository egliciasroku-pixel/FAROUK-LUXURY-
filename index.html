<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAYMENT PRO - ROYAL EDITION</title>
<style>
:root {
  --bg: #050811;
  --bg-gradient: radial-gradient(circle at top center, #0f172a 0%, #050811 70%);
  --panel: rgba(17, 24, 39, 0.75);
  --panel2: #1e293b;
  --input-bg: #0b1120;
  --lime: #a8ff00;
  --lime-glow: rgba(168, 255, 0, 0.35);
  --text: #f8fafc;
  --muted: #94a3b8;
  --red: #f43f5e;
  --blue: #38bdf8;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}
*{
  box-sizing:border-box;
  border: none !important;
  outline: none !important;
}
body{
  margin:0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,Tahoma,sans-serif;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
  min-height: 100vh;
}
header{
  padding:16px 24px;
  background: rgba(11, 17, 32, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* شعار PAYMENT PRO */
.logo-badge {
  position: relative;
  background: rgba(168, 255, 0, 0.06);
  padding: 10px 16px;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.logo-badge::before {
  content: '';
  position: absolute;
  top: 0;
  left: -150%;
  width: 150%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(168, 255, 0, 0.25),
    transparent
  );
  animation: shineWave 3s infinite linear;
}
@keyframes shineWave {
  0% { left: -150%; }
  50% { left: 150%; }
  100% { left: 150%; }
}
.logo{
  font-size:18px;
  font-weight:900;
  color: var(--lime);
  letter-spacing: 0.8px;
  text-shadow: 0 0 12px var(--lime-glow);
}

button{
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
  transition:transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
button:active{
  transform:scale(0.97);
}
button:hover{
  opacity:0.92;
}

/* الأزرار العلوية والقوائم المنسدلة */
.menu-container {
  position: relative;
}
.luxury-menu-btn {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.luxury-menu-btn:hover {
  background: linear-gradient(135deg, #334155 100%, #1e293b 0%);
}

.luxury-dropdown-menu {
  position: absolute;
  top: calc(100% + 10px);
  background: rgba(13, 20, 38, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
  width: 200px;
  padding: 8px;
  display: none;
  z-index: 101;
  animation: fadeIn 0.2s forwards;
}
html[dir="rtl"] .luxury-dropdown-menu { left: 0; right: auto; }
html[dir="ltr"] .luxury-dropdown-menu { right: 0; left: auto; }

.luxury-dropdown-menu.show {
  display: block;
}
.dropdown-item {
  width: 100%;
  background: transparent;
  color: var(--text);
  padding: 11px 12px;
  text-align: start;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.dropdown-item:hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--lime);
}

/* قائمة العملات الحية الملكية */
.currency-dropdown-royal {
  width: 280px !important;
  padding: 16px !important;
}
.currency-box-header {
  font-size: 11px;
  color: var(--lime);
  margin-bottom: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.currency-options-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.currency-option-card {
  background: rgba(255, 255, 255, 0.03);
  padding: 10px 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text);
}
.currency-option-card:hover {
  background: rgba(168, 255, 0, 0.08);
}
.currency-option-card.active {
  background: rgba(168, 255, 0, 0.15);
}
.currency-info {
  display: flex;
  align-items: center;
  gap: 10px;
}
.currency-flag-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--lime);
}
.radio-indicator {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
}
.currency-option-card.active .radio-indicator {
  border-color: var(--lime);
}
.currency-option-card.active .radio-indicator::after {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--lime);
  border-radius: 50%;
}

/* قائمة منسدلة ملكية لطريقة الأداء تختفي تلقائياً عند الاختيار */
.royal-dropdown-wrapper {
  position: relative;
  width: 100%;
}
.royal-dropdown-selected {
  background: var(--input-bg);
  color: var(--text);
  padding: 13px 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s ease;
}
.royal-dropdown-selected:hover {
  box-shadow: 0 0 0 3px var(--lime-glow);
}
.royal-dropdown-options {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: rgba(13, 20, 38, 0.98);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 12px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
  padding: 8px;
  display: none;
  z-index: 105;
  animation: fadeIn 0.2s forwards;
}
.royal-dropdown-options.show {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.royal-dropdown-option {
  padding: 11px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.2s ease, color 0.2s ease;
}
.royal-dropdown-option:hover {
  background: rgba(168, 255, 0, 0.1);
  color: var(--lime);
}
.royal-dropdown-option.active {
  background: rgba(168, 255, 0, 0.18);
  color: var(--lime);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:24px 18px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:16px;
  margin-bottom:24px;
}
.stat{
  background: var(--panel);
  backdrop-filter: blur(10px);
  border-radius:18px;
  padding:20px;
  box-shadow: var(--shadow);
}
.stat span{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}
.stat strong{
  display:block;
  color: var(--lime);
  font-size:clamp(20px, 3vw, 28px);
  margin-top:8px;
  font-weight:800;
  text-shadow: 0 0 10px var(--lime-glow);
}
h2{
  font-size:18px;
  margin:0 0 18px;
  color:var(--lime);
  font-weight:700;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:16px;
}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
  font-weight:600;
}
input,textarea{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  background:var(--input-bg);
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  transition:all 0.2s ease;
}
textarea{
  resize:vertical;
  min-height:80px;
}
input:focus,textarea:focus{
  box-shadow:0 0 0 3px var(--lime-glow);
}
.full{
  grid-column:1/-1;
}
.primary{
  background: var(--lime);
  color:#050811;
  box-shadow: 0 4px 20px var(--lime-glow);
  font-weight: 800;
}
.secondary{
  background:var(--panel2);
  color:var(--text);
}
.info{
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  color:#ffffff;
}
.danger{
  background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
  color:#ffffff;
  box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
.search{
  margin-bottom:16px;
  background:var(--input-bg);
  color:var(--text) !important;
}
.table-wrap{
  overflow-x:auto;
  border-radius:14px;
  background:#0d1426;
  padding:6px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 4px;
  min-width:650px;
}
th,td{
  padding:12px 14px;
  text-align:start;
  font-size:13px;
}
th{
  color:#ffffff;
  background:#0f172a;
  font-weight:700;
}
tbody tr{
  background: rgba(255, 255, 255, 0.02);
  transition:background 0.15s ease;
}
tbody tr:hover{
  background: rgba(255, 255, 255, 0.05);
}
td{
  color: var(--text);
}
.empty{
  text-align:center !important;
  color:var(--muted);
  padding:30px !important;
}
.badge{
  background: rgba(168, 255, 0, 0.12);
  color: var(--lime);
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  display:inline-block;
}
.badge-debt{
  background: rgba(244, 63, 94, 0.15);
  color: #fb7185;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  display:inline-block;
}
.small-btn{
  padding:8px 12px;
  font-size:12px;
  border-radius:8px;
  margin:2px;
}

/* شبكة الأزرار الفاخرة والأربعة الملكية */
.luxury-buttons-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.luxury-client-btn {
  width: 100%;
  background: linear-gradient(135deg, rgba(17, 24, 39, 0.85) 0%, rgba(23, 34, 56, 0.85) 100%);
  backdrop-filter: blur(10px);
  color: var(--text);
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
  text-align: start;
}
.luxury-client-btn::before {
  content: '';
  position: absolute;
  top: 0; right: 0; width: 4px; height: 100%;
  background: var(--lime);
  box-shadow: 0 0 12px var(--lime);
}
.luxury-client-btn.debt-btn::before {
  background: var(--red);
  box-shadow: 0 0 12px var(--red);
}
.luxury-client-btn.form-btn::before {
  background: var(--lime);
  box-shadow: 0 0 12px var(--lime);
}
.luxury-client-btn.history-btn::before {
  background: var(--blue);
  box-shadow: 0 0 12px var(--blue);
}
html[dir="ltr"] .luxury-client-btn::before {
  right: auto;
  left: 0;
}
.luxury-client-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
  background: linear-gradient(135deg, rgba(23, 34, 56, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
}
.luxury-btn-content {
  display: flex;
  align-items: center;
  gap: 14px;
}
.luxury-btn-icon {
  font-size: 22px;
  background: rgba(168, 255, 0, 0.1);
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.form-icon { background: rgba(168, 255, 0, 0.1) !important; color: var(--lime); }
.debt-icon { background: rgba(244, 63, 94, 0.1) !important; color: var(--red); }
.history-icon { background: rgba(56, 189, 248, 0.1) !important; color: var(--blue); }

.luxury-btn-text h3 {
  margin: 0;
  font-size: 15px;
  color: var(--lime);
  font-weight: 800;
  letter-spacing: 0.3px;
}
.form-title { color: var(--lime) !important; }
.debt-title { color: var(--red) !important; }
.history-title { color: var(--blue) !important; }

.luxury-btn-text p {
  margin: 3px 0 0 0;
  font-size: 11px;
  color: var(--muted);
}
.luxury-btn-badge {
  background: var(--lime);
  color: #050811;
  padding: 4px 10px;
  border-radius: 30px;
  font-weight: 800;
  font-size: 12px;
  box-shadow: 0 4px 15px var(--lime-glow);
  flex-shrink: 0;
}
.form-badge { background: var(--lime) !important; color: #050811 !important; }
.debt-badge { background: var(--red) !important; color: white !important; }
.history-badge { background: var(--blue) !important; color: #080d18 !important; }

/* النوافذ المنبثقة الملكية */
.modal-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(2, 4, 9, 0.85);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
  padding:16px;
  animation:fadeIn 0.2s forwards;
}
.modal-box{
  background: rgba(15, 23, 42, 0.96);
  backdrop-filter: blur(20px);
  border-radius:20px;
  padding:24px;
  width:100%;
  max-width:750px;
  max-height:90vh;
  overflow-y:auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  animation:scaleUp 0.2s forwards;
  position: relative;
}
@keyframes fadeIn{ to { opacity:1; } }
@keyframes scaleUp{ to { transform:scale(1); } }

footer{
  text-align:center;
  color:var(--muted);
  padding:24px 16px;
  font-size:12px;
}

/* تصميم الفاتورة الملكية الفاخرة */
#receiptModalContent{
  background: #ffffff;
  color: #111111;
  padding: 35px;
  border-radius: 14px;
  font-family: Arial, sans-serif;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.guarantee-stamp-top-left {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #16a34a;
  padding: 6px 12px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  transform: rotate(-6deg);
  letter-spacing: 0.5px;
  background: rgba(22, 163, 74, 0.05);
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.15;
}
.guarantee-stamp-top-left small {
  font-size: 8px;
  font-weight: 700;
  opacity: 0.85;
}

.invoice-number-top-right {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #f0fdf4;
  color: #166534;
  padding: 6px 14px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.5px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.2;
}
.invoice-number-top-right small {
  font-size: 9px;
  color: #666;
  font-weight: 600;
}

.receipt-header-top {
  text-align: center;
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 1.5px solid #eaeaea;
  position: relative;
}
.receipt-header-top h1 {
  color: #111;
  font-size: 20px;
  margin: 0 0 3px 0;
  font-weight: 900;
}
.receipt-header-top h2 {
  color: #16a34a;
  font-size: 15px;
  margin: 0 0 3px 0;
  font-weight: 800;
}
.receipt-header-top p {
  color: #666;
  font-size: 11px;
  margin: 0;
}
#receiptModalContent .receipt-line{
  padding: 10px 12px;
  margin-bottom: 6px;
  background: #f8fafc;
  border-radius: 8px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#receiptModalContent .receipt-total{
  font-size: 17px;
  font-weight: bold;
  background: #f0fdf4;
  color: #166534;
}

@media(max-width:900px){
  .form-grid{ grid-template-columns:repeat(2, 1fr); }
  .luxury-buttons-grid { grid-template-columns: repeat(2, 1fr); }
}
@media(max-width:650px){
  header{ padding:14px 16px; }
  .container{ padding:14px 12px; }
  .stats{ grid-template-columns:1fr; gap:10px; margin-bottom:16px; }
  .stat{ padding:15px 18px; display:flex; justify-content:space-between; align-items:center; }
  .stat strong{ margin-top:0; font-size:20px; }
  .form-grid{ grid-template-columns:1fr; gap:12px; }
  .actions{ flex-direction:column; }
  .actions button{ width:100%; padding:13px; }
  .luxury-buttons-grid { grid-template-columns: 1fr; }
  .luxury-client-btn { padding: 16px 18px; }
}
@media print{
  body{background:white!important;color:black!important}
  body > *:not(.modal-overlay){display:none!important}
  .modal-overlay{background:white!important;position:absolute!important;top:0!important;left:0!important;width:100%!important;height:auto!important;padding:0!important;backdrop-filter:none!important;}
  .modal-box{box-shadow:none!important;max-height:none!important;padding:0!important;background:white!important;}
  .modal-actions-bar{display:none!important}
}
</style>
</head>

<body>

<header>
  <!-- شعار PAYMENT PRO -->
  <div class="logo-badge">
    <div class="logo">
      PAYMENT PRO
    </div>
  </div>
  
  <div class="header-left">
    <!-- قائمة اختيار العملات الحية -->
    <div class="menu-container">
      <button class="luxury-menu-btn" onclick="toggleCurrencyMenu(event)" title="العملات الحية">
        <span>💱</span>
        <span id="currentCurrencyLabel">MAD</span>
      </button>
      <div class="luxury-dropdown-menu currency-dropdown-royal" id="currencyMenu">
        <div class="currency-box-header">
          <span id="currencyHeaderTitle">العملات الحية (تلقائي عبر IP)</span>
          <span style="font-size:10px; color:var(--lime);">● مباشر</span>
        </div>
        
        <div class="currency-options-grid">
          <div class="currency-option-card" data-val="MAD" onclick="changeCurrency('MAD')">
            <div class="currency-info">
              <div class="currency-flag-icon">د.م</div>
              <div>
                <div style="font-weight:700; font-size:13px;">MAD</div>
                <div style="font-size:10px; color:var(--muted);" id="currMadDesc">درهم مغربي</div>
              </div>
            </div>
            <div class="radio-indicator"></div>
          </div>

          <div class="currency-option-card" data-val="EUR" onclick="changeCurrency('EUR')">
            <div class="currency-info">
              <div class="currency-flag-icon">€</div>
              <div>
                <div style="font-weight:700; font-size:13px;">EUR</div>
                <div style="font-size:10px; color:var(--muted);" id="currEurDesc">يورو أوروبي</div>
              </div>
            </div>
            <div class="radio-indicator"></div>
          </div>

          <div class="currency-option-card" data-val="USD" onclick="changeCurrency('USD')">
            <div class="currency-info">
              <div class="currency-flag-icon">$</div>
              <div>
                <div style="font-weight:700; font-size:13px;">USD</div>
                <div style="font-size:10px; color:var(--muted);" id="currUsdDesc">دولار أمريكي</div>
              </div>
            </div>

async function detectLocationAndCurrency() {
 try {
  const res = await fetch('https://ipapi.co/json/');
  const data = await res.json();
  if(data && data.currency) {
   const detectedCurr = data.currency;
   const supported = ['MAD', 'EUR', 'USD', 'SAR'];
   if(!localStorage.getItem("payments_curr")) {
    if(supported.includes(detectedCurr)) {
     currentCurrency = detectedCurr;
    }
    localStorage.setItem("payments_curr", currentCurrency);
   }
   document.getElementById('ipLocationInfo').textContent = `${data.country_name || ''} (${data.ip || ''}) — ${currentCurrency}`;
  }
 } catch(e) {
  document.getElementById('ipLocationInfo').textContent = `Currency: ${currentCurrency}`;
 }
 updateCurrencyUI();
 renderStats();
}

function changeCurrency(val) {
 currentCurrency = val;

   card.classList.add('active');

 });
}

function money(value){
 return Number(value||0).toLocaleString("fr-FR",{maximumFractionDigits:2}) + " " + currentCurrency;
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}

function getClients(){
 const clients={};
 payments.forEach(p=>{
  const key=p.phone || p.name.toLowerCase();
  if(!clients[key]){
   clients[key]={name:p.name,phone:p.phone,total:0,paid:0,count:0};
  }
  clients[key].total+=Number(p.total);
  clients[key].paid+=Number(p.paid);
  clients[key].count++;
 });
 return Object.values(clients);
}

function renderStats(){
 const clients=getClients();
 const total=payments.reduce((s,p)=>s+Number(p.total),0);
 const paid=payments.reduce((s,p)=>s+Number(p.paid),0);
 const debtClients = clients.filter(c => (c.total - c.paid) > 0.01);

 document.getElementById("totalAmount").textContent=money(total);
 document.getElementById("paidAmount").textContent=money(paid);
 document.getElementById("clientCount").textContent=clients.length;
 document.getElementById("luxuryBadgeCount").textContent=clients.length;
 document.getElementById("luxuryDebtBadgeCount").textContent=debtClients.length;
 document.getElementById("luxuryHistoryBadgeCount").textContent=payments.length;
}

function handleFormSubmit(e, editId) {
 e.preventDefault();
 const total = Number(document.getElementById("modalTotal").value);
 const paid = Number(document.getElementById("modalPaid").value);

 if(total <= 0 || paid < 0){
  alert(t("alertAmount"));
  return;
 }
 if(paid > total){
  alert(t("alertPaid"));
  return;
 }

 const paymentData = {
  id: editId ? editId : Date.now(),
  name: document.getElementById("modalClientName").value.trim(),
  phone: document.getElementById("modalClientPhone").value.trim(),
  description: document.getElementById("modalDescription").value.trim(),
  total: total,
  paid: paid,
  method: document.getElementById("modalMethodInput").value,
  date: document.getElementById("modalDate").value,
  note: document.getElementById("modalNote").value.trim()
 };

 if(editId){
  const index = payments.findIndex(p => p.id === editId);
  if(index !== -1) payments[index] = paymentData;
 } else {
  payments.unshift(paymentData);
 }

 saveData();
 renderStats();
 closeModal();
 openHistoryModal();
}

function showClient(key){

 const paid=clientPayments.reduce((s,p)=>s+Number(p.paid),0);
 const remaining = total - paid;
 const name=clientPayments[0].name;

 let content=`
 <h2 style="color:var(--lime);margin-top:0">${escapeHTML(name)}</h2>
 <p>${t("amount")}: <b>${money(total)}</b></p>

}

function exportCSV(){
 const rows=[["Date","Client","Telephone","Description","Total","Paid","Method","Note"]];
 payments.forEach(p=>{
  rows.push([p.date,p.name,p.phone,p.description,p.total,p.paid,p.method,p.note]);
 });
 const csv="\uFEFF"+rows.map(row=>row.map(value=>'"'+String(value??"").replace(/"/g,'""')+'"').join(";")).join("\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="PAYMENTS.csv";
 a.click();
 URL.revokeObjectURL(url);
}

function clearAll(){
 if(!confirm(t("confirmAll")))return;
 payments=[];
 saveData();
 renderStats();
 closeModal();
}
